name: Website checks
on:
  pull_request:
  push:
    branches: [main, improve-website-navigation-2026-10]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate static pages and local links
        run: python scripts/check_site.py
